services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: plameli-backend-prod
    ports:
      - "8006:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DATABASE_NAME: ${DJANGO_DATABASE_NAME:-/data/db.sqlite3}
      DJANGO_MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-/data/media}
      DJANGO_SERVE_MEDIA: ${DJANGO_SERVE_MEDIA:-true}
      DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE: ${DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE:-1073741824}
      DJANGO_FILE_UPLOAD_MAX_MEMORY_SIZE: ${DJANGO_FILE_UPLOAD_MAX_MEMORY_SIZE:-10485760}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-ledgerlab.tech,www.ledgerlab.tech,backend,plameli-backend-prod}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-https://ledgerlab.tech,https://www.ledgerlab.tech}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://ledgerlab.tech,https://www.ledgerlab.tech}
      DJANGO_INTERACTIONS_LOG_LEVEL: ${DJANGO_INTERACTIONS_LOG_LEVEL:-INFO}
      DJANGO_ADMIN_USERNAME: ${DJANGO_ADMIN_USERNAME:-}
      DJANGO_ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:-}
      DJANGO_ADMIN_EMAIL: ${DJANGO_ADMIN_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      STRIPE_PAYMENT_METHOD_TYPES: ${STRIPE_PAYMENT_METHOD_TYPES:-card}
      STRIPE_CHECKOUT_EXPIRES_MINUTES: ${STRIPE_CHECKOUT_EXPIRES_MINUTES:-30}
      STRIPE_CONSULTATION_STANDARD_PRICE_EUR: ${STRIPE_CONSULTATION_STANDARD_PRICE_EUR:-150.00}
      STRIPE_CONSULTATION_PRIORITY_PRICE_EUR: ${STRIPE_CONSULTATION_PRIORITY_PRICE_EUR:-250.00}
      FRONTEND_URL: ${FRONTEND_URL:-https://ledgerlab.tech}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-~openai/gpt-latest}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://ledgerlab.tech}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-Plameli}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-20}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      CONSULTATION_TIMEZONE: ${CONSULTATION_TIMEZONE:-Europe/Sofia}
      CONSULTATION_SLOT_DAYS: ${CONSULTATION_SLOT_DAYS:-1,2,3,4}
      CONSULTATION_SLOT_TIMES: ${CONSULTATION_SLOT_TIMES:-13:00,14:30}
      CONSULTATION_DURATION_MINUTES: ${CONSULTATION_DURATION_MINUTES:-60}
      CONSULTATION_LOOKAHEAD_DAYS: ${CONSULTATION_LOOKAHEAD_DAYS:-30}
    volumes:
      - ${PLAMELI_DATA_DIR:-./backend/prod-data}:/data
    command: /app/entrypoint.prod.sh
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ledgerlab.tech/api}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://ledgerlab.tech}
    container_name: plameli-frontend-prod
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ledgerlab.tech/api}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://ledgerlab.tech}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000/api}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - backend
    restart: unless-stopped
