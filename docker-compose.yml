services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: plameli-backend-dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-development-only}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      DJANGO_INTERACTIONS_LOG_LEVEL: ${DJANGO_INTERACTIONS_LOG_LEVEL:-INFO}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      STRIPE_PAYMENT_METHOD_TYPES: ${STRIPE_PAYMENT_METHOD_TYPES:-card}
      STRIPE_CHECKOUT_EXPIRES_MINUTES: ${STRIPE_CHECKOUT_EXPIRES_MINUTES:-30}
      STRIPE_CONSULTATION_STANDARD_PRICE_EUR: ${STRIPE_CONSULTATION_STANDARD_PRICE_EUR:-150.00}
      STRIPE_CONSULTATION_PRIORITY_PRICE_EUR: ${STRIPE_CONSULTATION_PRIORITY_PRICE_EUR:-250.00}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-~openai/gpt-latest}
      OPENROUTER_SITE_URL: http://localhost:3000
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-Plameli}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-20}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      CONSULTATION_TIMEZONE: ${CONSULTATION_TIMEZONE:-Europe/Sofia}
      CONSULTATION_SLOT_DAYS: ${CONSULTATION_SLOT_DAYS:-1,2,3,4}
      CONSULTATION_SLOT_TIMES: ${CONSULTATION_SLOT_TIMES:-13:00,14:30}
      CONSULTATION_DURATION_MINUTES: ${CONSULTATION_DURATION_MINUTES:-60}
      CONSULTATION_LOOKAHEAD_DAYS: ${CONSULTATION_LOOKAHEAD_DAYS:-30}
    volumes:
      - ./backend:/app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: plameli-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
      NEXT_PUBLIC_BASE_URL: http://localhost:${FRONTEND_PORT:-3000}
      INTERNAL_API_URL: http://backend:8000/api
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
